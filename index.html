<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator - เว็บสร้างภาพตามสั่ง</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e1e2f, #252542);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #4facfe;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.5);
        }
        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 172, 254, 0.4);
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .result-box {
            margin-top: 20px;
            min-height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        img {
            width: 100%;
            height: auto;
            display: none;
            border-radius: 8px;
        }
        .loader {
            display: none;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid #4facfe;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .placeholder-text {
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎨 ระบบสร้างภาพด้วย AI</h1>
        
        <div class="input-group">
            <input type="text" id="promptInput" placeholder="พิมพ์สิ่งที่คุณต้องการเห็น (แนะนำภาษาอังกฤษ)...">
            <button id="generateBtn" onclick="generateImage()">เสกภาพ!</button>
        </div>

        <div class="result-box">
            <div class="loader" id="loader"></div>
            <p class="placeholder-text" id="placeholderText">ภาพของคุณจะปรากฏตรงนี้...</p>
            <img id="outputImage" alt="AI Generated Image">
        </div>
    </div>

    <script>
        function generateImage() {
            const promptInput = document.getElementById('promptInput').value.trim();
            const generateBtn = document.getElementById('generateBtn');
            const loader = document.getElementById('loader');
            const placeholderText = document.getElementById('placeholderText');
            const outputImage = document.getElementById('outputImage');

            // ตรวจสอบว่าพิมพ์ข้อความหรือยัง
            if (!promptInput) {
                alert('กรุณาพิมพ์ข้อความก่อนครับ!');
                return;
            }

            // เปิดโหมดโหลดเดอร์ และปิดปุ่มกดชั่วคราว
            generateBtn.disabled = true;
            generateBtn.innerText = 'กำลังเสกภาพ...';
            loader.style.display = 'block';
            placeholderText.style.display = 'none';
            outputImage.style.display = 'none';

            // แปลงข้อความเป็น URL-friendly (สุ่มตัวเลขด้านหลังเพื่อให้ได้ภาพใหม่เสมอ ไม่ติดแคช)
            const encodedPrompt = encodeURIComponent(promptInput);
            const randomNumber = Math.floor(Math.random() * 100000);
            
            // ใช้ API ของ Pollinations AI (โมเดล Flux ล่าสุด สวยงามมาก)
            const imageUrl = `https://image.pollinations.ai/p/${encodedPrompt}?width=1024&height=1024&seed=${randomNumber}&nologo=true`;

            // โหลดภาพเข้ามาในแท็ก <img>
            outputImage.src = imageUrl;

            // เมื่อภาพโหลดเสร็จแล้ว ให้แสดงผล
            outputImage.onload = function() {
                loader.style.display = 'none';
                outputImage.style.display = 'block';
                generateBtn.disabled = false;
                generateBtn.innerText = 'เสกภาพ!';
            };

            // กรณีเกิดข้อผิดพลาดในการโหลดภาพ
            outputImage.onerror = function() {
                loader.style.display = 'none';
                placeholderText.style.display = 'block';
                placeholderText.innerText = 'เกิดข้อผิดพลาดในการสร้างภาพ กรุณาลองใหม่อีกครั้ง';
                generateBtn.disabled = false;
                generateBtn.innerText = 'เสกภาพ!';
            };
        }
    </script>

</body>
</html>
