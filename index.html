<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบแปลงคำเป็นภาษาราชาศัพท์</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
            border-top: 8px solid #d4af37; /* สีทองราชาศัพท์ */
        }

        h2 {
            color: #333;
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            resize: vertical;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #d4af37;
        }

        button {
            width: 100%;
            background-color: #d4af37;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #aa8c2c;
        }

        .output-group {
            margin-top: 25px;
            background: #fffdf3;
            border: 1px dashed #d4af37;
            border-radius: 8px;
            padding: 15px;
            min-height: 80px;
        }

        .output-title {
            font-weight: bold;
            color: #aa8c2c;
            margin-bottom: 8px;
            font-size: 14px;
        }

        #result {
            font-size: 16px;
            color: #2c3e50;
            white-space: pre-wrap;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>👑 ระบบแปลงเป็นคำราชาศัพท์</h2>
    
    <div class="input-group">
        <label for="inputText">พิมพ์ข้อความหรือประโยคทั่วไปที่นี่:</label>
        <textarea id="inputText" placeholder="ตัวอย่าง: ฉัน กินข้าว แล้ว นอนหลับ แขน ของฉัน เจ็บ..."></textarea>
    </div>
    
    <button onclick="convertToRoyal()">✨ แปลงเป็นคำราชาศัพท์</button>
    
    <div class="output-group">
        <div class="output-title">ผลลัพธ์ภาษาราชาศัพท์:</div>
        <div id="result">ผลลัพธ์จะปรากฏตรงนี้...</div>
    </div>
</div>

<script>
    // คลังคำศัพท์ (Dictionary) สำหรับจับคู่คำทั่วไป -> คำราชาศัพท์
    // สามารถมาเพิ่มคำศัพท์ตรงนี้ได้เรื่อยๆ ครับ
    const royalDictionary = {
        "กินข้าว": "เสวยพระกระยาหาร",
        "กิน": "เสวย",
        "นอนหลับ": "บรรทม",
        "นอน": "บรรทม",
        "ไป": "เสด็จพระราชดำเนิน",
        "มา": "เสด็จมา",
        "พูด": "ตรัส",
        "บอก": "ตรัส",
        "หัวเราะ": "ทรงพระสรวล",
        "ร้องไห้": "ทรงพระกันแสง",
        "โกรธ": "ทรงพระพิโรธ",
        "ดีใจ": "ทรงพระปรีดา",
        "ป่วย": "ทรงพระประชวร",
        "อาบน้ำ": "สรงน้ำ",
        "แต่งตัว": "ทรงเครื่อง",
        "ให้": "พระราชทาน",
        "คิด": "ทรงพระราชดำริ",
        "อยากได้": "พระราชประสงค์",
        
        // หมวดร่างกาย / เครือญาติ
        "หัว": "พระเศียร",
        "ผม": "พระเกศา",
        "หน้า": "พระพักตร์",
        "ตา": "พระเนตร",
        "หู": "พระกรรณ",
        "จมูก": "พระนาสิก",
        "ปาก": "พระโอษฐ์",
        "ฟัน": "#พระทนต์",
        "มือ": "พระหัตถ์",
        "เท้า": "#พระบาท",
        "แขน": "#พระพาหา",
        "ขา": "#พระเพลา",
        "ใจ": "#พระราชหฤทัย",
        
        "พ่อ": "พระบรมชนกนาถ",
        "แม่": "#พระราชชนนี",
        "พี่ชาย": "#พระเชษฐา",
        "น้องชาย": "#พระอนุชา",
        "พี่สาว": "#พระเชษฐภคินี",
        "น้องสาว": "#พระขนิษฐา",
        "ลูก": "#พระราชโอรส/พระราชธิดา",

        // สรรพนาม
        "ฉัน": "ข้าพระพุทธเจ้า",
        "ผม": "ข้าพระพุทธเจ้า",
        "เรา": "ข้าพระพุทธเจ้า"
    };

    function convertToRoyal() {
        let text = document.getElementById("inputText").value;
        
        if (!text.trim()) {
            document.getElementById("result").innerText = "กรุณาพิมพ์ประโยคก่อนกดแปลงครับ";
            return;
        }

        // นำคลังคำศัพท์มาวนลูปเพื่อแทนที่คำในประโยค
        let convertedText = text;
        
        // เรียงลำดับคำใน Dictionary ให้คำที่ยาวกว่าอยู่ก่อน เพื่อป้องกันการแทนที่ผิดพลาด (เช่น "กินข้าว" ต้องแปลก่อน "กิน")
        const sortedKeys = Object.keys(royalDictionary).sort((a, b) => b.length - a.length);

        for (let key of sortedKeys) {
            // ใช้ Regular Expression ในการเปลี่ยนทุกคำที่เจอในประโยค
            let regex = new RegExp(key, "g");
            convertedText = convertedText.replace(regex, royalDictionary[key]);
        }

        // แสดงผลลัพธ์
        document.getElementById("result").innerText = convertedText;
    }
</script>

</body>
</html>
